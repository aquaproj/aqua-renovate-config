---
name: Test Presets
on: workflow_call
jobs:
  test-presets:
    # Test presets by Renovate's dry-run. See scripts/test.sh.
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/test.sh
