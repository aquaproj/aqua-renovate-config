---
name: test (workflow_call)
on: workflow_call
permissions: {}
jobs:
  path-filter:
    # Get changed files to filter jobs
    timeout-minutes: 10
    outputs:
      preset: ${{steps.changes.outputs.preset}}
      test-presets: ${{steps.changes.outputs.test-presets}}
      changed_presets_files: ${{steps.changes.outputs.changed_presets_files}}
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          list-files: shell
          filters: |
            preset:
              - "*.json"
              - ./.github/workflows/workflow_call_validate_presets.yaml
            test-presets:
              - "*.json"
              - tests/**
              - scripts/test.sh
              - .github/workflows/workflow_call_test_presets.yaml
            changed_presets:
              - "*.json"

  test-workflow:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.65.2
    permissions:
      contents: read
      pull-requests: read

  validate-presets:
    needs: path-filter
    if: needs.path-filter.outputs.preset == 'true'
    uses: ./.github/workflows/workflow_call_validate_presets.yaml
    with:
      files: ${{ needs.path-filter.outputs.changed_presets_files }}

  test-presets:
    needs: path-filter
    if: needs.path-filter.outputs.test-presets == 'true'
    uses: ./.github/workflows/workflow_call_test_presets.yaml
