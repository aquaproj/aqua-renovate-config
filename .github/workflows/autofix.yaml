---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  autofix:
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
      - run: aqua upc -prune
      - run: git ls-files | nllint -s -f
      - run: |
          git ls-files | grep -E "\.jsonnet$" | xargs -n 1 jsonnetfmt -i
          git ls-files | grep -E "\.libsonnet$" | xargs -n 1 jsonnetfmt -i
      - run: bash scripts/generate.sh
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
